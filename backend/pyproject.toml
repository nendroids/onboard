[project]
name = "backend"
version = "1.0.0"
description = "backend"
readme = "README.md"
authors = [
    { name = "Harsh", email = "23f3002742@ds.study.iitm.ac.in" }
]
requires-python = ">=3.14"
dependencies = [
    "celery==5.6.3",
    "click==8.4.2",
    "flask==3.1.3",
    "flask-caching==2.4.1",
    "flask-cors==6.0.5",
    "flask-jwt-extended==4.7.4",
    "flask-login==0.6.3",
    "flask-mail==0.10.0",
    "flask-migrate==4.1.0",
    "flask-security==5.8.1",
    "flask-sqlalchemy==3.1.1",
    "marshmallow==4.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-flask==1.3.0",
    "python-dotenv==1.2.2",
    "redis==8.0.1",
    "ruff==0.16.0",
    "sqlalchemy==2.0.51",
    "werkzeug==3.1.8",
]

[project.scripts]
backend = "backend.app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "backend"
